# fly.toml
app = "devduel"
primary_region = "sin"   # Singapore — closest to India

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port       = 8000
  force_https         = true
  auto_stop_machines  = false
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "10s"
  interval     = "30s"
  method       = "GET"
  path         = "/"
  timeout      = "5s"

[env]
  PORT = "8000"